name: Docker Releases

on:
  push:
    # The existing releases are bare numbers (1.0.0.6), so accept those and v-prefixed tags.
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Get Version
        id: get_version
        run: |
          # ::set-output was disabled by GitHub in 2022, which made VERSION2 empty and pushed
          # the versionless tag "release-". $GITHUB_OUTPUT is the supported channel.
          version="${GITHUB_REF#refs/tags/}"
          echo "VERSION1=${version}" >> "$GITHUB_OUTPUT"
          echo "VERSION2=${version#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # One build, two tags: the old job built the same image twice, and the second
          # build is where the empty VERSION2 showed up. The image gates itself - the
          # Dockerfile runs the taint-mode compile sweep and the test suite during the build.
          tags: |
            orcpub/dndgenerator:latest
            orcpub/dndgenerator:release-${{ steps.get_version.outputs.VERSION2 }}
