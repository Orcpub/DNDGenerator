<Directory /var/www/>
    AllowOverride All
    Require all granted
</Directory>
ServerName localhost
RedirectMatch ^/$ /generator/

# The document root is the application's own source tree: 43 Perl modules under lib/, the
# xml data files, the Templates. The CGI scripts read them from disk; nothing on the site
# fetches them over HTTP (the only $.ajax call in source/js posts to namegenerator). Deny
# them in server config so the rule does not depend on AllowOverride. The Dockerfile
# deletes tests/ and puppet/ on the same grounds; these rules cover what it keeps.
<DirectoryMatch "^/var/www/html/generator/(lib|xml|Templates|tests|puppet)/">
    Require all denied
</DirectoryMatch>
# genstats is a bash line-count script, ideas is a text fragment: neither is a page, and
# genstats is executable, so leaving it served is leaving it runnable through the handler.
<FilesMatch "(^|/)(genstats|ideas)$">
    Require all denied
</FilesMatch>
# Body cap and cache discipline for CGI responses. The predicate matches the ExecCGI
# predicate in source/.htaccess: every entry point, no static asset. 64 KiB is far above
# the site's only form post ($.ajax to namegenerator, a few hundred bytes) and far below
# the 80 MB POST measured to peak at 823 MiB of container memory. CGI pages echo part of
# the URL, so they must not be cached by a shared proxy.
<FilesMatch "generator$">
    LimitRequestBody 65536
    Header set Cache-Control "no-store"
</FilesMatch>
<IfModule mod_expires.c>
    ExpiresActive On
    # Types as this server actually reports them (Apache 2.4.71, curl -sI on the running
    # container): css/style.css -> text/css, js/CityMap.js -> text/javascript,
    # img/*.png -> image/png, fonts/*.ttf -> font/ttf. Debian's /etc/mime.types maps .js to
    # text/javascript, so the previous application/javascript line matched nothing and .js
    # was served with no Cache-Control at all. Those four types are everything the site
    # ships; the .woff/.eot/.svg that css/font-awesome.min.css asks for are not in the repo.
    ExpiresByType text/css "access plus 7 days"
    ExpiresByType text/javascript "access plus 7 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType font/ttf "access plus 30 days"
</IfModule>
